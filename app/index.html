<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SMB Player</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Laden -->
<div id="screenLoading" class="screen center">
  <div class="spinner"></div>
  <p id="loadingText">Starte …</p>
</div>

<!-- Meldung (Fehler / noch keine Freigabe) -->
<div id="screenMessage" class="screen center" hidden>
  <h1 id="msgTitle"></h1>
  <p id="msgText"></p>
  <p id="msgHint" class="hint"></p>
  <p class="keyhint"><span class="key">OK</span> Erneut versuchen &nbsp;&nbsp; <span class="key">Zurück</span> Schließen</p>
</div>

<!-- Dateibrowser -->
<div id="screenBrowse" class="screen" hidden>
  <div id="head">
    <h1 id="title">SMB Player</h1>
    <div id="crumb"></div>
    <div id="clock"></div>
  </div>
  <ul id="list" class="vlist"></ul>
  <div id="empty" hidden></div>
  <div id="side" class="side">
    <div class="sideTop">
      <div class="sideIconBox"><span id="sideIco" class="ico"></span></div>
      <div class="sideTimes"><div id="sideSize"></div><div id="sideDate"></div></div>
    </div>
    <div id="sideChan" class="sideChan"></div>
    <div id="sideTitle" class="sideTitle"></div>
    <div id="sideDesc" class="sideDesc"></div>
    <div id="sideProg" class="sideProg" hidden><div id="sideProgFill"></div></div>
  </div>
  <div id="foot"></div>
</div>

<!-- Player -->
<div id="screenPlayer" class="screen" hidden>
  <video id="video"></video>
  <div id="buffering" hidden><div class="spinner"></div></div>
  <div id="osd" hidden>
    <div class="osdRow">
      <span id="osdState" class="play"></span>
      <span id="osdName"></span>
      <span id="osdClock"></span>
    </div>
    <div id="osdGroup"></div>
    <div id="osdNow"></div>
    <div class="bar"><div id="osdFill"></div></div>
    <div id="osdNext"></div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
