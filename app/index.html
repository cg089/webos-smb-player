<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SMB Player</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Laden -->
<div id="screenLoading" class="screen center">
  <div class="spinner"></div>
  <p id="loadingText">Starte …</p>
</div>

<!-- Meldung (Fehler / noch keine Freigabe) -->
<div id="screenMessage" class="screen center" hidden>
  <h1 id="msgTitle"></h1>
  <p id="msgText"></p>
  <p id="msgHint" class="hint"></p>
  <p class="keyhint"><span class="key">OK</span> Erneut versuchen &nbsp;&nbsp; <span class="key">Zurück</span> Schließen</p>
</div>

<!-- Dateibrowser -->
<div id="screenBrowse" class="screen" hidden>
  <div id="head">
    <h1 id="title">SMB Player</h1>
    <div id="crumb"></div>
  </div>
  <ul id="list"></ul>
  <div id="empty" hidden></div>
  <div id="foot"></div>
</div>

<!-- Player -->
<div id="screenPlayer" class="screen" hidden>
  <video id="video"></video>
  <div id="buffering" hidden><div class="spinner"></div></div>
  <div id="osd" hidden>
    <div id="osdTitle"></div>
    <div class="bar"><div id="osdFill"></div></div>
    <div class="times"><span id="osdState">❚❚</span><span id="osdTime">0:00 / 0:00</span></div>
  </div>
  <div id="toast" hidden></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
